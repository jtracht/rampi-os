name: Image candidate
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build using pinned official pi-gen
        run: bash image/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image
          path: artifacts/image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  validate:
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image
          path: artifacts/image
      - name: Software image validation and QEMU boot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm dosfstools e2fsprogs
          bash image/test-image.sh artifacts/image/*.img.xz artifacts/image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-validation
          path: |
            artifacts/image/*.log
            artifacts/image/partitions.json
            artifacts/image/package-manifest.tsv
            artifacts/image/dependency-licenses.tar.xz
          if-no-files-found: ignore
          retention-days: 7
