name: Image candidate
on:
  workflow_dispatch:
    inputs:
      image_run_id:
        description: 'Optional: validate an existing candidate artifact from this run; never used for releases'
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: image-${{ github.ref }}-${{ inputs.image_run_id || 'build' }}
  cancel-in-progress: false
jobs:
  image:
    if: inputs.image_run_id == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build using pinned official pi-gen
        run: |
          set -euo pipefail
          docker build -t rampi-rust-dev -f tests/rust/Dockerfile .
          docker run --rm -v "$PWD:/src:ro" -v rampi-rust-build:/build -e CARGO_HOME=/build/cargo rampi-rust-dev bash -ec 'cargo fmt --all --check; cargo test --locked -p rampi-core; cargo clippy --locked --workspace --all-targets -j 1 -- -D warnings; cargo build --locked --release --workspace -j 1; python3 scripts/collect-rust-licenses.py /build/rust-licenses'
          mkdir -p artifacts/native
          container=$(docker create -v rampi-rust-build:/build:ro rampi-rust-dev true)
          docker cp "$container:/build/target/release/rampi-native" artifacts/native/rampi-native
          docker cp "$container:/build/rust-licenses" artifacts/native/rust-licenses
          docker rm "$container"
          chmod 755 artifacts/native/rampi-native
          RAMPI_NATIVE_BINARY="$PWD/artifacts/native/rampi-native" RAMPI_RUST_LICENSE_DIR="$PWD/artifacts/native/rust-licenses" bash image/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image
          path: artifacts/image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  validate:
    needs: image
    if: always() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_run_id != ''))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image
          path: artifacts/image
          run-id: ${{ inputs.image_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Software image validation and QEMU boot
        env:
          IMAGE_PRODUCER_RUN: ${{ inputs.image_run_id || github.run_id }}
          VALIDATOR_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm dosfstools e2fsprogs device-tree-compiler file python3-pil
          echo "Image producer run: $IMAGE_PRODUCER_RUN; validator revision: $VALIDATOR_SHA"
          [[ "$IMAGE_PRODUCER_RUN" =~ ^[0-9]+$ ]]
          export IMAGE_PRODUCER_SHA
          IMAGE_PRODUCER_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_PRODUCER_RUN" --jq .head_sha)
          bash image/test-image.sh artifacts/image/*.img.xz artifacts/image
          bash image/test-graphical-image.sh artifacts/image/*.img.xz artifacts/image/graphical-login
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-validation
          path: |
            artifacts/image/*.log
            artifacts/image/qemu-environment.txt
            artifacts/image/partitions.json
            artifacts/image/native-image-provenance.txt
            artifacts/image/package-manifest.tsv
            artifacts/image/dependency-licenses.tar.xz
            artifacts/image/graphical-login/
          if-no-files-found: ignore
          retention-days: 7
