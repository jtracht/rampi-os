name: Rust and Wayland
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rust-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t rampi-rust-dev -f tests/rust/Dockerfile .
      - name: Locked native Rust build, formatting, lint and core tests
        run: |
          docker run --rm -v "$PWD:/src:ro" -v rampi-rust-build:/build -e CARGO_HOME=/build/cargo rampi-rust-dev bash -ec 'cargo fmt --all --check; cargo test --locked -p rampi-core; cargo clippy --locked --workspace --all-targets -j 1 -- -D warnings; cargo build --locked --workspace -j 1'
      - name: Package the actual native ARM64 installer payload
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" -v rampi-rust-build:/build -e CARGO_HOME=/build/cargo rampi-rust-dev python3 scripts/collect-rust-licenses.py /build/installer-licenses
          mkdir -p artifacts/native
          container=$(docker create -v rampi-rust-build:/build:ro rampi-rust-dev true)
          docker cp "$container:/build/target/debug/rampi-native" artifacts/native/rampi-native
          docker cp "$container:/build/installer-licenses" artifacts/native/licenses
          docker rm "$container"
          chmod 755 artifacts/native/rampi-native
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" rampi-rust-dev python3 scripts/package-native.py --binary artifacts/native/rampi-native --licenses artifacts/native/licenses --output artifacts/native
          mkdir -p artifacts/release
          cp artifacts/native/rampi-linux-arm64-*.tar.xz artifacts/release/
          python3 scripts/package.py
          python3 scripts/check-artifacts.py artifacts/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.arch == 'arm64'
        with:
          name: native-installer-arm64
          path: artifacts/release/
          if-no-files-found: error
      - name: Real headless Wayland session, no X11 and 1 GiB limit
        run: |
          set -euo pipefail
          # Ubuntu's host policy also restricts nested user-namespace UID maps.
          # Temporarily permit them only on this disposable GitHub-hosted VM;
          # restore the original value even when Docker or acceptance fails.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          namespace_policy=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          trap 'sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$namespace_policy"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p artifacts/rust
          chmod 777 artifacts/rust
          docker run --rm --network none --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined --user 1000:1000 --memory=1g --memory-swap=1g --cpus=4 -v "$PWD:/src:ro" -v "$PWD/artifacts/rust:/artifacts" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 -e RAMPI_TEST_ARTIFACTS=/artifacts rampi-rust-dev dbus-run-session -- bash tests/rust/run-wayland.sh 2>&1 | tee artifacts/rust/wayland.log
      - name: Rust Wayland installer and session syntax
        run: |
          docker run --rm -v "$PWD:/src:ro" rampi-rust-dev shellcheck installer/raspberrypi/setup.sh installer/raspberrypi/greeter-profile.sh system/rampi system/rampi-session system/rampi-wayland-start system/rampi-health tests/rust/run-wayland.sh
      - name: Embedded Rust RDP with real TLS server, input and reconnect
        run: |
          set -euo pipefail
          docker build --build-arg BASE_IMAGE=rampi-rust-dev -f tests/remote/Dockerfile -t rampi-rdp-fixture .
          python3 tests/rust/test-rdp.py --image rampi-rust-dev --artifacts artifacts/rust 2>&1 | tee artifacts/rust/rdp-acceptance.log
      - name: Ten-minute mixed RDP, WebKit and three-PTY workload in 1 GiB
        run: |
          set -euo pipefail
          namespace_policy=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          trap 'sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$namespace_policy"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p artifacts/rust/mixed-soak
          chmod 777 artifacts/rust/mixed-soak
          python3 tests/rust/test-rdp.py --soak --image rampi-rust-dev --artifacts artifacts/rust/mixed-soak 2>&1 | tee artifacts/rust/mixed-soak/acceptance.log
          python3 scripts/check-soak-evidence.py artifacts/rust/mixed-soak
      - name: Actual HTTPS native bootstrap and archive/provenance rejection
        run: |
          set -euo pipefail
          docker run --rm --network none --memory=1g --memory-swap=1g -v "$PWD:/src:ro" -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev python3 tests/rust/test-bootstrap.py 2>&1 | tee artifacts/rust/bootstrap-tls.log
      - name: Actual encrypted keyring, cloud HTTPS contracts and GTK Kanban
        run: |
          set -euo pipefail
          docker run --rm --network none --memory=1g --memory-swap=1g --cpus=4 -v "$PWD:/src:ro" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev python3 tests/rust/test-cloud-kanban.py 2>&1 | tee artifacts/rust/cloud-kanban.log
      - name: Rust GIO network contract on an isolated system bus (no radio)
        run: |
          set -euo pipefail
          docker run --rm --network none --user 1000:1000 -v "$PWD:/src:ro" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev python3 tests/rust/test-services.py | tee artifacts/rust/network-contract.log
      - name: Actual unprivileged passwd, PAM and account isolation
        run: |
          set -euo pipefail
          docker run --rm --network none --memory=1g --memory-swap=1g -v "$PWD:/src:ro" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev python3 tests/rust/test-accounts.py 2>&1 | tee artifacts/rust/account-pam.log
      - name: Actual trusted HTTPS and integrated WebKit downloads
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          namespace_policy=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          trap 'sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$namespace_policy"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --network none --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined --memory=1g --memory-swap=1g -v "$PWD:/src:ro" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev python3 tests/rust/test-browser.py 2>&1 | tee artifacts/rust/browser-https.log
      - name: Rust GIO Bluetooth contract and discovery cleanup (no radio)
        run: |
          set -euo pipefail
          docker run --rm --network none --user 1000:1000 -v "$PWD:/src:ro" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev python3 tests/rust/test-bluetooth.py | tee artifacts/rust/bluetooth-contract.log
      - name: Rust libnm WireGuard import and personal profile contract (no tunnel)
        run: |
          set -euo pipefail
          docker run --rm --network none --user 1000:1000 -v "$PWD:/src:ro" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev python3 tests/rust/test-wireguard.py | tee artifacts/rust/wireguard-contract.log
      - name: Actual Rust and NetworkManager WireGuard peers with account isolation
        run: |
          set -euo pipefail
          timeout 240 python3 scripts/test-native-wireguard.py 2>&1 | tee artifacts/rust/wireguard-peers.log
      - name: Official Tailscale daemon status and bounded CLI failure cases (no enrollment)
        run: |
          set -euo pipefail
          docker run --rm --network none --user 1000:1000 -v "$PWD:/src:ro" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev python3 tests/rust/test-tailscale.py | tee artifacts/rust/tailscale-status.log
      - name: Actual ARM64 native installer lifecycle in a disposable container
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" -v rampi-rust-build:/build:ro -e RAMPI_TEST_CONTAINER=1 rampi-rust-dev bash tests/rust/test-installer.sh 2>&1 | tee artifacts/rust/installer-lifecycle.log
          grep -q RAMPI_RUST_INSTALLER_LIFECYCLE_OK artifacts/rust/installer-lifecycle.log
      - name: Actual Rust WLAN on virtual radios with WPA2 and DHCP
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          docker build -f tests/virtual/Dockerfile -t rampi-virtual-tools .
          docker run --rm --memory=3g --memory-swap=3g --cpus=4 -v "$PWD:/app" -v rampi-rust-build:/build:ro rampi-virtual-tools python3 scripts/test-virtual-linux.py --native-binary /build/target/debug/rampi-network-acceptance --timeout 1500
      - name: Graphical greetd and PAM with two native user sessions in fresh QEMU
        run: |
          set -euo pipefail
          docker build -f tests/virtual/Dockerfile -t rampi-virtual-tools .
          docker run --rm --memory=3g --memory-swap=3g --cpus=4 -v "$PWD:/app" -v rampi-rust-build:/build:ro rampi-virtual-tools python3 scripts/test-virtual-linux.py --native-session-binary /build/target/debug/rampi-native --timeout 1800
          expected=$(docker run --rm -v rampi-rust-build:/build:ro rampi-rust-dev sha256sum /build/target/debug/rampi-native | cut -d ' ' -f 1)
          docker run --rm -v "$PWD:/src:ro" rampi-rust-dev python3 scripts/check-login-evidence.py artifacts/virtual-login --expected-binary "$expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: graphical-login-${{ matrix.arch }}
          path: |
            artifacts/virtual-login/serial.log
            artifacts/virtual-login/environment.json
            artifacts/virtual-login/captures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.arch == 'amd64'
        with:
          name: rust-virtual-radio-amd64
          path: |
            artifacts/virtual-linux/serial.log
            artifacts/virtual-linux/environment.json
          if-no-files-found: ignore
      - name: Require complete runtime, tunnel, performance and installer evidence
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$ARCH" == arm64 ]]; then
            python3 scripts/check-native-evidence.py artifacts/rust --require-installer
          else
            python3 scripts/check-native-evidence.py artifacts/rust
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-wayland-${{ matrix.arch }}
          path: artifacts/rust/
          if-no-files-found: ignore
