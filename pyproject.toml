[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rampi-os"
version = "0.1.0.dev0"
description = "A native remote workstation shell for Raspberry Pi"
requires-python = ">=3.11"
license = "Apache-2.0 AND ISC AND MIT"
dependencies = ["PySide6>=6.8.2,<6.9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "PyYAML>=6", "build>=1.2", "pip-audit>=2.9", "graphql-core>=3.2,<4"]

[project.scripts]
rampi = "rampi.app:main"

[tool.setuptools]
package-dir = {"" = "client"}

[tool.setuptools.packages.find]
where = ["client"]

[tool.setuptools.package-data]
rampi = ["qml/*.qml", "branding/*.png", "icons/*.svg", "icons/LICENSE", "icons/README.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
files = ["client/rampi"]
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rampi.backend"
# Qt's runtime Property decorator and QVariant slot signatures are absent in 6.8 stubs.
disable_error_code = ["call-arg", "arg-type"]

[tool.pytest.ini_options]
pythonpath = ["client"]
testpaths = ["tests"]
