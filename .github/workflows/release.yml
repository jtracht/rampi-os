name: Release
on:
  workflow_run:
    workflows: [CI, 'Rust and Wayland']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  readiness:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if python3 scripts/check-release-ci.py --sha "$TESTED_SHA" && python3 scripts/check-release.py; then
            python3 scripts/prepare-development-release.py --regular --tag-only --check-remote-tag >> "$GITHUB_OUTPUT"
            echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Regular release withheld: matching general/native main CI or product readiness is incomplete.' >> "$GITHUB_STEP_SUMMARY"
          fi
  image:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.readiness.outputs.sha }}
  publish:
    needs: [readiness, image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.readiness.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image
          path: artifacts/image
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-validation
          path: artifacts/image
      - name: Install the graphical validator dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil
      - name: Assemble the complete native artifact set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.readiness.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check-release.py
          python3 scripts/check-release-ci.py --sha "$RELEASE_SHA" --output artifacts/release/release-ci.json
          python3 scripts/package.py
          python3 scripts/prepare-development-release.py --regular --image-dir artifacts/image
          python3 scripts/check-artifacts.py artifacts/release --image
      - name: Publish a new stable tag only after fresh image acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.readiness.outputs.tag }}
          RELEASE_SHA: ${{ needs.readiness.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
          python3 scripts/prepare-development-release.py --regular --tag-only --check-remote-tag
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA"
          gh release create "$RELEASE_TAG" artifacts/release/* \
            --verify-tag --draft --title "Rampi OS $RELEASE_TAG · Rust/Wayland" \
            --notes-file artifacts/native-release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
