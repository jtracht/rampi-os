name: Image candidate
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build using pinned official pi-gen
        run: bash image/build.sh
      - name: Software image validation and QEMU boot
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm dosfstools e2fsprogs
          bash image/test-image.sh artifacts/image/*.img.xz artifacts/image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image
          path: artifacts/image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
