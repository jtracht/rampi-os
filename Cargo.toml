[workspace]
members = ["native/core", "native/ui"]
resolver = "2"

[workspace.package]
version = "0.6.0-dev.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/jtracht/rampi-os"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
