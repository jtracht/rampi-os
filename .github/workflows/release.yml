name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  readiness:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: check
        run: |
          if python3 scripts/check-release.py; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Regular release withheld: see packaging/readiness.json' >> "$GITHUB_STEP_SUMMARY"
          fi
  version:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require the tested commit to still be main
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  image:
    needs: version
    if: needs.version.outputs.created == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
  publish:
    needs: [version, image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image
          path: artifacts/image
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-validation
          path: artifacts/image
      - run: python3 scripts/package.py
      - name: Publish only the complete verified artifact set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          python3 scripts/check-release.py
          cp artifacts/image/* artifacts/release/
          cd artifacts/release
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          test -n "$(find . -name '*.img.xz' -print -quit)"
          python3 ../../scripts/check-artifacts.py . --image
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ./* --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --draft=false
