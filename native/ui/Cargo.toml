[package]
name = "rampi-ui"
default-run = "rampi-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rampi-native"
path = "src/main.rs"

[[bin]]
name = "rampi-network-acceptance"
path = "src/bin/network-acceptance.rs"

[dependencies]
rampi-core = { path = "../core" }
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
rampi-stream = { path = "../stream" }
zeroize = "1"
keycodemap = { package = "rdw-keycodemap", path = "../../vendor/rdw/keycodemap" }
vte = { package = "vte4", version = "0.10", features = ["v0_76"] }
webkit6 = "0.6.1"
tempfile = "3"
rdw = { package = "rdw4", path = "../../vendor/rdw/rdw4", default-features = false, features = ["wayland"] }
rdw-rdp = { package = "rdw4-rdp", path = "../../vendor/rdw/rdw4-rdp", default-features = false }
